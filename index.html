async function dl(n,d,t){try{const u=await window.claude?.use('downloads');if(!u)throw 0;await u.save({filename:n,data:new Blob(['\ufeff'+d],{type:t})})}catch(e){if(e&&e.code=='declined')return;box(d)}}

function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm(x('سيتم دمج البيانات واستبدال الأشهر المتطابقة. متابعة؟','Data will be merged; matching months overwritten. Continue?')))return;Object.assign(DB,d);persist();Object.keys(d).forEach(dbSave);SEL=keys().pop();render()}catch(e){toast(x('ملف غير صالح','Invalid file'))}};r.readAsText(f)}

i:[{name:'Demo Influencer A',plat:'Snapchat',cost:15000,views:420000,eng:21000,orders:310,rev:21500},{name:'Demo Influencer B',plat:'TikTok',cost:9000,views:610000,eng:33000}],c:[{name:'Demo: Mon-Tue Offer',cost:6000,orders:Math.round(1900*g),sales:Math.round(160000*g)},{name:'Demo: First order 20%',cost:4000,orders:700,sales:42000}],a:[{action:'Demo: track promo codes',obj:'Attribution',prio:'High',kpi:'Coverage',target:'100%',owner:'Marketing',due:'',status:'Open'}]}}persist()}
